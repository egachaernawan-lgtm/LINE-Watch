<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}{% endblock %}</title>
<style>
  @page { size: A4; margin: 18mm 15mm; }
  body { font-family: "Helvetica Neue", Arial, sans-serif; color: #111; font-size: 11pt; line-height: 1.45; }
  h1 { font-size: 22pt; margin: 0 0 4px; } h1 .g { color: #06C755; }
  h2 { font-size: 14pt; margin: 26px 0 8px; padding-bottom: 4px; border-bottom: 2px solid #06C755; }
  h2 .count { font-size: 10pt; color: #888; font-weight: normal; }
  .sub { color: #555; margin-bottom: 18px; }
  .article { margin: 0 0 14px; padding: 10px 12px; border: 1px solid #EBEBEB; border-radius: 8px; page-break-inside: avoid; }
  .headline { font-weight: bold; font-size: 11.5pt; } .headline a { color: #111; text-decoration: none; }
  .meta { color: #555; font-size: 9.5pt; margin: 2px 0 4px; }
  .s-positive { color: #05A648; font-weight: bold; } .s-negative { color: #FF334B; font-weight: bold; } .s-neutral { color: #555; font-weight: bold; }
  ul { margin: 4px 0 6px 18px; padding: 0; }
  .source { font-size: 9pt; word-break: break-all; } .source a { color: #007AFF; }
  .empty { color: #888; font-style: italic; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 10pt; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #EBEBEB; } th { background: #F4F4F4; }
  .kpis { display: table; width: 100%; margin: 10px 0; } .kpi { display: table-cell; padding: 10px 12px; background: #F4F4F4; border-radius: 8px; }
  .kpi b { display: block; font-size: 20pt; } .kpi span { color: #555; font-size: 9pt; }
  .charts img { max-width: 100%; } .row { display: table; width: 100%; } .row > div { display: table-cell; width: 50%; vertical-align: top; padding-right: 8px; }
  .foot { margin-top: 28px; color: #888; font-size: 9pt; }
</style>
</head>
<body>
{% block body %}{% endblock %}
<div class="foot">Generated by LINE WATCH · every article links to its original source.</div>
</body>
</html>
