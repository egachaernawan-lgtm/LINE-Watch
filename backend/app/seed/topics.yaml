# Indonesian media only. Reject links whose host ends in another country's domain (vietnam.vn, *.it, *.sg ...);
# `.id`, `.com`, `.co`, `.net`, `.org` and other generic endings pass. Extra hosts to reject go here.
blocked_hosts:
  - pasqualepillitteri.it
