  - {group: Service, name: LINE GIFTSHOP, category: LINE}
  - {group: Service, name: LINE FRIENDS, category: LINE}
  - {group: Service, name: LINE Financial, category: LINE, description: "Incl. LINE Insurance, Smart Investment, Kakeibo, Credit, Score and Pocket Money"}
  - {group: Service, name: LINE Bank, category: LINE, description: "Incl. LINE BK and LINE Bank by Hana Bank. Priority in Indonesia"}
  - {group: Service, name: Crypto/Blockchain, category: LINE, description: "Incl. DOSI VAULT, DOSI Wallet and LINE Blockchain"}
