  - {group: Service, name: DOSI, category: LINE, description: "Incl. GAME DOSI, AVA and ACRZ"}
  - {group: Service, name: Game, category: LINE, description: "Incl. LINE GAME(s), LINE studio and LINE POD. Priority: Let's Get Rich, LINE Rangers"}
