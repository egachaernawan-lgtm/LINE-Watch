# Topic library: what LINE WATCH monitors, from keywords.md (LINE) and keywords-external.md (external).
# Every keyword in keywords.yaml points at one topic here via `topic: "<group>/<name>"`.
#
# category   which report section the topic belongs to (LINE | COMPETITOR | INDUSTRY).
# cap        max articles shown per topic in the daily report (external topics only; LINE is never capped).
# judged     true = no search term can find it (Earnings, HR, General...); Gemini picks the topic from this
#            list when it analyses an article that matched a keyword.
# Scope: Indonesian media only. Passing mentions of LINE services still count (see ANALYSIS_SYSTEM).

groups:
  Business: "News on LINE's business operation & relationships"
  Tech: "Articles on technologies"
  Service: "News on LINE's services (other LINE services may be added to the list)"
  Leadership: "News on corporate leadership"
  Competitor: "Competing messaging and social platforms"
  Industry: "Industry and regulation context"

topics:
  # Business
  - {group: Business, name: Earnings, category: LINE, judged: true}
  - {group: Business, name: Corporate, category: LINE, description: "Incl. M&A, investment, partnership, LINE ownership issue and IPO"}
  - {group: Business, name: HR, category: LINE, judged: true, description: "Incl. hiring, internship and LINE hybrid work"}
  - {group: Business, name: NAVER, category: LINE}
  - {group: Business, name: IPX, category: LINE}
  - {group: Business, name: General, category: LINE}
  # Tech
  - {group: Tech, name: Blockchain, category: LINE, judged: true}
  - {group: Tech, name: AI, category: LINE, description: "HyperCLOVA X"}
  - {group: Tech, name: General, category: LINE, description: "Incl. LINE's tech events"}
  # Service
  - {group: Service, name: Messenger, category: LINE, description: "Incl. LINE Openchat, LINE Theme and LINE Alert"}
  - {group: Service, name: LINE OA, category: LINE, description: "Official Account"}
  - {group: Service, name: LINE STICKERS, category: LINE}
