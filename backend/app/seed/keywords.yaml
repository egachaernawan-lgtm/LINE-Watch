# Search terms. Each points at one topic in topics.yaml (`topic: "<group>/<name>"`).
# category priority when an article matches several: LINE > COMPETITOR > GOVERNMENT > INDUSTRY
# case_sensitive: true for short/ambiguous terms (a bare "line" is not LINE).
# scope: lead = only counts when it is in the headline or the first paragraph (default for INDUSTRY/GOVERNMENT);
#        anywhere = counts anywhere in the article (default for LINE and COMPETITOR).
#        Broad competitor names (Google, Meta, ...) use lead so they do not flood the feed.

# ---- LINE: Business
- {term: "LINE", category: LINE, company: LINE, case_sensitive: true, topic: "Business/General"}
- {term: "LINE Indonesia", category: LINE, company: LINE, topic: "Business/General"}
- {term: "LY Corporation", category: LINE, company: LINE, aliases: ["LY Corp", "LINE Yahoo", "LINE Yahoo Corp", "LINE Corporation"], topic: "Business/Corporate"}
- {term: "NAVER", category: LINE, company: LINE, aliases: ["Naver Corp", "Naver Corporation"], topic: "Business/NAVER"}
- {term: "IPX", category: LINE, company: LINE, case_sensitive: true, aliases: ["IPX Corporation"], topic: "Business/IPX"}
