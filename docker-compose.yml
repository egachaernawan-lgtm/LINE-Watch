services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: linewatch
      POSTGRES_PASSWORD: linewatch
      POSTGRES_DB: linewatch
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://linewatch:linewatch@db:5432/linewatch
    depends_on: [db]
    ports: ["8080:8080"]

volumes:
  pgdata:
